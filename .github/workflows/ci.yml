name: DealFlow CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Check code style with ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run automated tests
        if: always() && steps.install.outcome == 'success'
        run: |
          if node -e "process.exit(Object.hasOwn(require('./package.json').scripts ?? {}, 'test') ? 0 : 1)"; then
            npm test
          else
            echo "::error title=Automated tests are not configured::Add a test script and test suite to package.json before CI can verify tests."
            exit 1
          fi
